<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>事项管理</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <main class="page">
    <h1 class="app-title">事项管理</h1>

    <section class="card" aria-labelledby="form-heading">
      <h2 id="form-heading">新增事项</h2>
      <form id="item-form" novalidate>
        <div class="field">
          <label for="title-input">标题</label>
          <input id="title-input" name="title" type="text" autocomplete="off"
                 placeholder="必填；去除两端空白后不超过 80 字">
        </div>
        <div class="field-row">
          <div class="field">
            <label for="status-input">状态</label>
            <select id="status-input" name="status">
              <option value="todo" selected>待办</option>
              <option value="in_progress">进行中</option>
              <option value="done">完成</option>
            </select>
          </div>
          <div class="field">
            <label for="priority-input">优先级</label>
            <select id="priority-input" name="priority">
              <option value="high">高</option>
              <option value="medium" selected>中</option>
              <option value="low">低</option>
            </select>
          </div>
        </div>
        <div class="form-actions">
          <button id="submit-btn" type="submit">添加事项</button>
          <button id="cancel-edit-btn" type="button" hidden>取消编辑</button>
        </div>
      </form>
      <p id="message" role="status" hidden></p>
    </section>

    <section class="card" aria-labelledby="list-heading">
      <h2 id="list-heading">事项列表</h2>

      <div class="toolbar">
        <div class="search-box">
          <label for="search-input" class="visually-hidden">关键词搜索</label>
          <input id="search-input" type="search" placeholder="按标题关键词搜索">
          <button id="search-btn" type="button">搜索</button>
        </div>
        <div class="filter-box">
          <label for="filter-status">状态筛选</label>
          <select id="filter-status">
            <option value="" selected>全部</option>
            <option value="todo">待办</option>
            <option value="in_progress">进行中</option>
            <option value="done">完成</option>
          </select>
        </div>
      </div>

      <p id="loading" class="loading" hidden>加载中…</p>
      <p id="empty-state" class="empty" hidden></p>
      <ul id="item-list" class="item-list" aria-live="polite"></ul>

      <nav class="pagination" aria-label="分页">
        <button id="prev-btn" type="button">上一页</button>
        <span id="page-info">第 1 / 1 页 · 共 0 条</span>
        <button id="next-btn" type="button">下一页</button>
      </nav>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>

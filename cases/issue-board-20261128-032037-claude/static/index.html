<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>事项管理</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/static/styles.css">
</head>
<body>
<div class="app">
  <header class="app-header">
    <h1>事项管理</h1>
    <p class="subtitle">待办 · 进行中 · 完成</p>
  </header>

  <section class="panel" aria-label="新增或编辑事项">
    <h2 id="form-title">新增事项</h2>
    <form id="item-form" novalidate>
      <input type="hidden" id="edit-id" value="">
      <div class="field">
        <label for="title-input">标题<span class="req">*</span></label>
        <input type="text" id="title-input" maxlength="120"
               placeholder="必填，去除两端空白后不超过 80 字" autocomplete="off">
      </div>
      <div class="field-row">
        <div class="field">
          <label for="status-select">状态</label>
          <select id="status-select">
            <option value="todo" selected>待办</option>
            <option value="in_progress">进行中</option>
            <option value="done">完成</option>
          </select>
        </div>
        <div class="field">
          <label for="priority-select">优先级</label>
          <select id="priority-select">
            <option value="low">低</option>
            <option value="medium" selected>中</option>
            <option value="high">高</option>
          </select>
        </div>
      </div>
      <div class="actions">
        <button type="submit" id="submit-btn">创建</button>
        <button type="button" id="cancel-edit-btn" class="secondary" hidden>取消编辑</button>
      </div>
    </form>
  </section>

  <div id="message" class="message" role="status" aria-live="polite" hidden></div>

  <section class="panel" aria-label="事项列表">
    <div class="toolbar">
      <div class="field search-field">
        <label for="search-input">关键词搜索</label>
        <input type="search" id="search-input" placeholder="按标题搜索…" autocomplete="off">
      </div>
      <div class="field">
        <label for="filter-status">状态筛选</label>
        <select id="filter-status">
          <option value="">全部状态</option>
          <option value="todo">待办</option>
          <option value="in_progress">进行中</option>
          <option value="done">完成</option>
        </select>
      </div>
    </div>

    <div id="loading" class="loading" hidden>加载中…</div>

    <ul id="item-list" class="item-list"></ul>

    <div id="empty-state" class="empty" hidden></div>

    <nav class="pager" aria-label="分页">
      <button type="button" id="prev-btn">上一页</button>
      <span id="page-info">第 1 / 1 页 · 共 0 条</span>
      <button type="button" id="next-btn">下一页</button>
    </nav>
  </section>

  <footer class="app-footer">
    <small>数据保存在本地 SQLite（cases/issue-board-20261128-032037-claude）</small>
  </footer>
</div>
<script src="/static/app.js"></script>
</body>
</html>

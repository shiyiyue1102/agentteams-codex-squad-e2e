<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>离线问候</title>
</head>
<body>
  <h1>hello</h1>
  <button type="button" id="greet">问候</button>
  <p id="greeting" role="status" aria-live="polite"></p>
  <script>
    document.getElementById('greet').addEventListener('click', function () {
      document.getElementById('greeting').textContent = '你好，有什么事';
    });
  </script>
</body>
</html>
